<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<title>AnimeList</title>

<!-- MANIFIESTO WEB COMPLETO PARA PWA Y PWABUILDER -->
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
  %22name%22: %22AnimeList - Catálogo y Seguimiento%22,
  %22short_name%22: %22AnimeList%22,
  %22description%22: %22Aplicación para buscar, seguir y organizar tus animés y mangas favoritos con integración en la API de AniList.%22,
  %22start_url%22: %22./index.html%22,
  %22scope%22: %22./%22,
  %22display%22: %22standalone%22,
  %22orientation%22: %22any%22,
  %22background_color%22: %22%23121214%22,
  %22theme_color%22: %22%23FF6400%22,
  %22categories%22: [%22books%22, %22entertainment%22, %22utilities%22],
  %22icons%22: [
    {
      %22src%22: %22https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3fa.png%22,
      %22sizes%22: %2272x72%22,
      %22type%22: %22image/png%22
    },
    {
      %22src%22: %22https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3fa.png%22,
      %22sizes%22: %22192x192%22,
      %22type%22: %22image/png%22,
      %22purpose%22: %22any maskable%22
    },
    {
      %22src%22: %22https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f3fa.png%22,
      %22sizes%22: %22512x512%22,
      %22type%22: %22image/png%22,
      %22purpose%22: %22any maskable%22
    }
  ]
}">

<style>
  :root {
    --bg: #121214;
    --surface: #1c1c20;
    --line: #2d2d33;
    --brand: #FF6400;
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
  }
  html:not(.dark) {
    --bg: #f4f4f5;
    --surface: #ffffff;
    --line: #e4e4e7;
    --text-main: #18181b;
    --text-muted: #71717a;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html { -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding: 16px; padding-bottom: 80px; transition: background-color 0.2s, color 0.2s; }
  
  .max-w-6xl { max-width: 72rem; margin: 0 auto; }
  .flex { display: flex; }
  .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .gap-2 { gap: 0.5rem; }
  .gap-3 { gap: 0.75rem; }
  .gap-4 { gap: 1rem; }
  .mb-3 { margin-bottom: 0.75rem; }
  .mb-4 { margin-bottom: 1rem; }
  .mb-5 { margin-bottom: 1.25rem; }
  .mt-auto { margin-top: auto; }
  .w-full { width: 100%; }
  .hidden { display: none !important; }
  
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
  .text-brand { color: var(--brand); }
  
  button, select, input { font: inherit; }
  
  .btn-primary {
    background-color: var(--brand);
    color: #000;
    font-weight: 800;
    padding: 0.625rem 1.25rem;
    border-radius: 0.75rem;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    transition: transform 0.1s, background-color 0.2s;
  }
  .btn-primary:active { transform: scale(0.95); }
  
  .btn-surface {
    background-color: var(--surface);
    color: var(--text-main);
    border: 1px solid var(--line);
    padding: 0.625rem 1rem;
    border-radius: 0.75rem;
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .btn-surface:hover { border-color: var(--brand); }

  input[type="search"] {
    flex: 1;
    min-width: 0;
    background-color: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-main);
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--brand); }

  .grid { display: grid; gap: 0.75rem; }
  @media(min-width: 640px) { .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media(min-width: 768px) { .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .md\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media(min-width: 1024px) { .lg\:grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

  .card {
    background-color: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  .badge-brand { background: rgba(255,100,0,0.15); color: var(--brand); font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); }
  
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text-main);
    padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 100;
  }

  * { scrollbar-width: thin; scrollbar-color: var(--line) var(--surface); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
</head>

<body>

<main class="max-w-6xl mx-auto px-4 py-5">

  <!-- ENCABEZADO Y CAMBIO DE TEMA -->
  <header>
    <div class="flex items-center gap-3">
      <h1><span class="text-brand">Anime</span><span>List</span></h1>
      <button id="listViewBtn" data-action="toggle-library-view" aria-pressed="false" class="btn-primary">
        Mi Lista
      </button>
    </div>
    <div class="flex items-center gap-2">
      <button id="themeToggleBtn" data-action="toggle-theme" class="btn-surface flex items-center gap-2">
        <span id="themeIcon">☀️</span> <span id="themeText">Modo Claro</span>
      </button>
    </div>
  </header>

  <!-- BUSCADOR Y BOTÓN DE CATEGORÍAS -->
  <div class="relative mb-4 flex gap-2">
    <input id="searchInput" type="search" autocomplete="off" placeholder="Buscar animé o manga en AniList…">
    <button id="categoryMenuBtn" data-action="toggle-categories" class="btn-surface flex items-center gap-2">
      <span>Categorías</span>
      <span style="font-size: 10px;">▼</span>
    </button>
    <button id="clearSearchBtn" data-action="clear-search" class="hidden" style="color:var(--brand); background:none; border:none; font-weight:bold; cursor:pointer; padding:0 8px;">Limpiar</button>
  </div>

  <!-- MENÚ DESPLEGABLE DE CATEGORÍAS -->
  <div id="categoriesDropdown" class="hidden mb-4" style="background:var(--surface); border:1px solid var(--line); border-radius:0.75rem; padding:1.25rem; box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);">
    <div class="flex justify-between items-center mb-4">
      <span style="font-size:11px; font-weight:bold; color:var(--text-muted); text-transform:uppercase;">Temas / Categorías</span>
      <span id="selectedCategoryBadge" style="font-size:12px; color:var(--brand); font-weight:600;">Seleccionado: Todos</span>
    </div>
    <div id="categoriesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3" style="font-size:14px;"></div>
  </div>

  <!-- VISTA CATÁLOGO -->
  <div id="catalogView">
    <!-- BARRA DE ORDENAMIENTO -->
    <div class="flex gap-2 no-scrollbar mb-5" id="sortBar" style="overflow-x:auto; padding-bottom:4px;">
      <button data-sort="POPULARITY_DESC" class="sort-btn btn-primary shrink-0" style="font-size:12px; padding:6px 12px; border-radius:999px;">🔥 Más populares</button>
      <button data-sort="TITLE_ENGLISH" class="sort-btn btn-surface shrink-0" style="font-size:12px; padding:6px 12px; border-radius:999px;">🔤 A-Z</button>
      <button data-sort="TRENDING_DESC" class="sort-btn btn-surface shrink-0" style="font-size:12px; padding:6px 12px; border-radius:999px;">👁️ Más vistos</button>
      <button data-sort="SCORE_DESC" class="sort-btn btn-surface shrink-0" style="font-size:12px; padding:6px 12px; border-radius:999px;">⭐ Mejores votados</button>
      <button data-sort="HIDDEN_GEMS" class="sort-btn btn-surface shrink-0" style="font-size:12px; padding:6px 12px; border-radius:999px;">💎 Joyas ocultas</button>
    </div>

    <!-- SECCIÓN DE RESULTADOS -->
    <section id="searchPanel" class="mb-8">
      <div class="flex items-center justify-between gap-2 mb-3">
        <h2 id="searchTitle" style="font-size:1.1rem; font-weight:600;">Catálogo General (Anime & Manga)</h2>
      </div>

      <!-- PAGINACIÓN SUPERIOR -->
      <div id="paginationTopContainer" class="flex justify-center items-center gap-2 mb-4 flex-wrap"></div>

      <div id="searchResults" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>

      <!-- PAGINACIÓN INFERIOR -->
      <div id="paginationContainer" class="flex justify-center items-center gap-2 mt-6 flex-wrap"></div>
    </section>
  </div>

  <!-- VISTA DE MI LISTA -->
  <section id="libraryView" class="hidden">
    <div class="flex items-center justify-between gap-3 mb-4">
      <h2 style="font-size:1.25rem; font-weight:bold;">Mi Lista Personal</h2>
      <button data-action="toggle-library-view" class="btn-surface">← Volver al catálogo</button>
    </div>

    <!-- BÚSQUEDA EN MI LISTA -->
    <section id="librarySearchPanel" class="hidden mb-6" style="border:1px solid rgba(255,100,0,0.3); border-radius:1rem; padding:12px; background:var(--surface);">
      <div id="librarySearchResults" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
    </section>

    <!-- SELECTOR TIPO -->
    <div class="flex gap-3 mb-4" style="border-bottom:1px solid var(--line); padding-bottom:12px;">
      <button id="mediaTypeAnimeBtn" data-action="switch-media-type" data-type="ANIME" class="btn-primary" style="font-size:14px; padding:8px 16px;">📺 Anime</button>
      <button id="mediaTypeMangaBtn" data-action="switch-media-type" data-type="MANGA" class="btn-surface" style="font-size:14px; padding:8px 16px;">📖 Manga</button>
    </div>

    <div class="flex items-center justify-between gap-3 mb-3">
      <h3 id="collectionTitle" style="font-size:1.1rem; font-weight:bold;">Colección de Anime</h3>
      <span id="libraryCount" style="font-size:11px; font-weight:600; color:var(--text-muted); background:var(--surface); border:1px solid var(--line); padding:4px 10px; border-radius:999px;"></span>
    </div>

    <nav id="tabs" class="flex gap-2 no-scrollbar mb-3" style="overflow-x:auto; padding-bottom:4px;"></nav>

    <div class="flex items-center gap-2 mb-4">
      <span style="font-size:10px; font-weight:bold; color:var(--text-muted); text-transform:uppercase;">Orden</span>
      <div id="librarySortBar" class="flex gap-2 no-scrollbar" style="overflow-x:auto;">
        <button data-lib-sort="recent" class="lib-sort-btn btn-primary shrink-0" style="font-size:12px; padding:4px 12px; border-radius:999px;">🕒 Recientes</button>
        <button data-lib-sort="az" class="lib-sort-btn btn-surface shrink-0" style="font-size:12px; padding:4px 12px; border-radius:999px;">🔤 A-Z</button>
      </div>
    </div>

    <section id="library" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></section>
    <p id="empty" class="hidden" style="text-align:center; color:var(--text-muted); padding:4rem 0;">Aquí no hay nada todavía.</p>
  </section>
</main>

<!-- MODAL AGREGAR -->
<div id="addStatusModal" class="hidden" style="position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; padding:16px;">
  <div style="background:var(--surface); border:1px solid var(--line); width:100%; max-width:360px; border-radius:1rem; padding:20px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
    <h3 id="addModalTitle" style="font-weight:bold; font-size:1rem; margin-bottom:8px;">Agregar a Mi Lista</h3>
    <div style="margin-bottom:1rem; padding-top:4px;">
      <button id="addModalFavBtn" type="button" class="w-full" style="padding:10px 16px; border-radius:0.75rem; border:1px solid rgba(234,179,8,0.4); background:rgba(234,179,8,0.1); color:#facc15; font-weight:bold; font-size:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
        <span><span id="addModalStarIcon">☆</span> Añadir a Favoritos</span>
        <span id="addModalFavState" style="font-size:12px; font-weight:normal; opacity:0.7;">No</span>
      </button>
    </div>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">Selecciona el estado inicial:</p>
    <div id="addStatusOptions" class="flex flex-wrap gap-2 mb-4" style="flex-direction:column;"></div>
    <div class="flex gap-2">
      <button data-action="confirm-add-modal" class="btn-primary" style="flex:1; padding:10px;">Guardar</button>
      <button data-action="close-add-modal" class="btn-surface" style="background:var(--line); padding:10px 16px;">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div id="modal" class="hidden" style="position:fixed; inset:0; z-index:40; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; padding:12px;">
  <div style="background:var(--surface); border:1px solid var(--line); width:100%; max-width:650px; max-height:90vh; overflow-y:auto; border-radius:1rem; padding:20px;">
    <div id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="hidden"></div>

<script>
// REGISTRO AUTOMÁTICO DE SERVICE WORKER PARA PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      self.addEventListener('install', (e) => { self.skipWaiting(); });
      self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  });
}

(() => {
'use strict';
const DB_KEY = 'my_anime_tracker_db';
const API_URL = 'https://graphql.anilist.co';

const ANIME_STATUSES = { watching: '📺 En espera', airing: '🔴 En emisión', later: '📌 Ver después', done: '✅ Visto' };
const MANGA_STATUSES = { watching: '📺 En espera', airing: '🔴 En emisión', reading: '📖 Leyendo', done: '✅ Leído', later: '📌 Leer después' };

const collator = new Intl.Collator('es', { sensitivity: 'base', numeric: true });
const ALL_CATEGORIES = [
  { label: 'Todos', genre: null, tag: null },
  { label: 'Acción', genre: 'Action', tag: null },
  { label: 'Aventura', genre: 'Adventure', tag: null },
  { label: 'Comedia', genre: 'Comedy', tag: null },
  { label: 'Drama', genre: 'Drama', tag: null },
  { label: 'Fantasía', genre: 'Fantasy', tag: null },
  { label: 'Romance', genre: 'Romance', tag: null },
  { label: 'Ciencia Ficción', genre: 'Sci-Fi', tag: null },
  { label: 'Seinen', genre: null, tag: 'Seinen' },
  { label: 'Shounen', genre: 'Shounen', tag: null },
  { label: 'Slice of Life', genre: 'Slice of Life', tag: null },
  { label: 'Deportes', genre: 'Sports', tag: null },
  { label: 'Sobrenatural', genre: 'Supernatural', tag: null }
];

const STATUS_MAP_ES = { 'RELEASING': 'En emisión', 'FINISHED': 'Finalizado', 'CANCELLED': 'Cancelado' };

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const titleOf = (m) => m.title?.english || m.title?.romaji || m.title?.native || 'Sin título';

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.add('hidden'), 2500);
}

const Store = {
  data: { version: 1, items: {} },
  load() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) this.data = JSON.parse(raw);
    } catch (e) { console.warn(e); }
  },
  save: debounce(() => {
    try { localStorage.setItem(DB_KEY, JSON.stringify(Store.data)); } catch {}
  }, 250),
  get: (id) => Store.data.items[id],
  list: () => Object.values(Store.data.items),
};

const mediaCache = new Map();
let activeCategory = ALL_CATEGORIES[0];
let activeSort = 'POPULARITY_DESC';
let currentPage = 1;
const PER_PAGE = 20;
let currentMediaType = 'ANIME';

async function gql(query, variables, signal) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ query, variables }),
    signal,
  });
  if (!res.ok) throw new Error('Error al conectar con AniList');
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

const ANILIST_PAGINATED_QUERY = `query($q:String, $genre:String, $tag:String, $page:Int, $perPage:Int, $sort:[MediaSort]){
  Page(page:$page, perPage:$perPage){
    pageInfo{ total perPage currentPage lastPage hasNextPage }
    media(search:$q, genre:$genre, tag:$tag, isAdult:false, sort:$sort){
      id type title{romaji english native} coverImage{large} episodes chapters status seasonYear genres tags{name} averageScore popularity
    }
  }
}`;

let apiCtrl = null;
async function fetchMediaPage({ q = null, genre = null, tag = null, page = 1, sort = ['POPULARITY_DESC'], perPage = PER_PAGE } = {}) {
  apiCtrl?.abort();
  apiCtrl = new AbortController();
  const vars = { page, perPage, sort: [sort[0]] };
  if (q) vars.q = q;
  if (genre) vars.genre = genre;
  if (tag) vars.tag = tag;

  const data = await gql(ANILIST_PAGINATED_QUERY, vars, apiCtrl.signal);
  const pageInfo = data.Page.pageInfo;
  let media = data.Page.media;
  media.forEach((m) => mediaCache.set(m.id, m));
  return { media, pageInfo };
}

let currentTab = 'all';
let showingLibrary = false;
let librarySort = 'recent';
let pendingItemToAdd = null;
let pendingModalStatus = 'watching';
let pendingModalFav = false;

function syncSearchUI() {
  const input = $('#searchInput');
  input.placeholder = showingLibrary ? 'Buscar en la base de datos de AniList…' : 'Buscar animé o manga en el catálogo…';
  $('#clearSearchBtn').classList.toggle('hidden', !(input.value.trim() || activeCategory.label !== 'Todos'));
}

function toggleLibraryView() {
  showingLibrary = !showingLibrary;
  $('#catalogView').classList.toggle('hidden', showingLibrary);
  $('#libraryView').classList.toggle('hidden', !showingLibrary);
  const btn = $('#listViewBtn');
  btn.textContent = showingLibrary ? 'Volver al catálogo' : 'Mi Lista';
  if (showingLibrary) { renderAll(); } else { loadMainCatalog(); }
}

function promptAddStatus(id) {
  const m = mediaCache.get(id);
  if (!m) return;
  pendingItemToAdd = m;
  const isManga = m.type === 'MANGA';
  const statusDict = isManga ? MANGA_STATUSES : ANIME_STATUSES;
  pendingModalStatus = isManga ? 'reading' : 'watching';
  pendingModalFav = false;
  $('#addModalTitle').textContent = `Agregar "${titleOf(m)}"`;
  updateModalFavUI();
  renderModalStatusOptions(statusDict);
  $('#addStatusModal').classList.remove('hidden');
}

function updateModalFavUI() {
  const btn = $('#addModalFavBtn');
  const icon = $('#addModalStarIcon');
  const state = $('#addModalFavState');
  if (pendingModalFav) {
    btn.style.background = '#eab308';
    btn.style.color = '#000';
    icon.textContent = '⭐';
    state.textContent = '¡Sí!';
  } else {
    btn.style.background = 'rgba(234,179,8,0.1)';
    btn.style.color = '#facc15';
    icon.textContent = '☆';
    state.textContent = 'No';
  }
}

function renderModalStatusOptions(statusDict) {
  const box = $('#addStatusOptions');
  box.innerHTML = Object.entries(statusDict).map(([k, l]) => `
    <button type="button" data-status-key="${k}" style="width:100%; text-align:left; padding:10px 14px; border-radius:0.5rem; border:1px solid var(--line); background:${k === pendingModalStatus ? 'var(--brand)' : 'var(--surface)'}; color:${k === pendingModalStatus ? '#000' : 'var(--text-main)'}; font-weight:${k === pendingModalStatus ? 'bold' : 'normal'}; cursor:pointer;">
      ${l}
    </button>`).join('');
}

$('#addStatusOptions').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-status-key]');
  if (!btn) return;
  pendingModalStatus = btn.dataset.statusKey;
  renderModalStatusOptions(pendingItemToAdd.type === 'MANGA' ? MANGA_STATUSES : ANIME_STATUSES);
});

$('#addModalFavBtn').addEventListener('click', () => {
  pendingModalFav = !pendingModalFav;
  updateModalFavUI();
});

function confirmAddModal() {
  if (!pendingItemToAdd) return;
  const m = pendingItemToAdd;
  if (!Store.get(m.id)) {
    const isManga = m.type === 'MANGA';
    Store.data.items[m.id] = {
      id: m.id, type: isManga ? 'MANGA' : 'ANIME', title: titleOf(m),
      cover: m.coverImage?.large || '', total: isManga ? m.chapters : m.episodes,
      progress: 0, status: pendingModalStatus, fav: pendingModalFav, addedAt: Date.now()
    };
    Store.save();
    renderAll();
    refreshCardControls(m.id);
    toast(`"${titleOf(m)}" agregado`);
  }
  $('#addStatusModal').classList.add('hidden');
  pendingItemToAdd = null;
}

function changeEpisode(id, delta) {
  const a = Store.get(id);
  if (!a) return;
  a.progress = Math.min(a.total ?? Infinity, Math.max(0, a.progress + delta));
  Store.save(); renderAll(); refreshCardControls(id);
}

function renderCategoryDropdown() {
  $('#categoriesGrid').innerHTML = ALL_CATEGORIES.map((cat) => `
    <button data-action="select-category" data-label="${cat.label}" class="btn-surface" style="text-align:left; width:100%;">
      ${cat.label}
    </button>`).join('');
}

function renderTabs() {
  const isManga = currentMediaType === 'MANGA';
  const statusDict = isManga ? MANGA_STATUSES : ANIME_STATUSES;
  const items = Store.list().filter(a => a.type === currentMediaType);
  const tabsObj = { all: 'Todos', ...statusDict, fav: '⭐ Favoritos' };

  $('#tabs').innerHTML = Object.entries(tabsObj).map(([k, label]) => {
    const count = k === 'all' ? items.length : k === 'fav' ? items.filter(a => a.fav).length : items.filter(a => a.status === k).length;
    const active = k === currentTab;
    return `<button data-action="tab" data-tab="${k}" style="padding:6px 14px; border-radius:999px; font-size:13px; font-weight:${active?'bold':'normal'}; background:${active?'var(--brand)':'var(--surface)'}; color:${active?'#000':'var(--text-main)'}; border:1px solid var(--line); cursor:pointer;">
      ${label} (${count})
    </button>`;
  }).join('');
}

function libraryCard(a) {
  const isManga = a.type === 'MANGA';
  const statusDict = isManga ? MANGA_STATUSES : ANIME_STATUSES;
  return `<article class="card" data-id="${a.id}">
    <div style="position:relative; aspect-ratio:2/3; background:#000;">
      <img src="${esc(a.cover)}" alt="" style="width:100%; height:100%; object-fit:cover;">
      <span style="position:absolute; bottom:4px; left:4px;" class="badge-brand">${isManga ? 'MANGA' : 'ANIME'}</span>
      <button data-action="fav" style="position:absolute; top:6px; left:6px; background:rgba(0,0,0,0.6); border:none; border-radius:50%; width:28px; height:28px; cursor:pointer; color:${a.fav?'#facc15':'#fff'};">${a.fav?'⭐':'☆'}</button>
    </div>
    <div style="padding:8px; display:flex; flex-direction:column; gap:6px; flex:1;">
      <h3 style="font-size:13px; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${esc(a.title)}</h3>
      <div class="flex items-center justify-between" style="gap:4px;">
        <button data-action="dec" class="btn-surface" style="padding:2px 8px;">−</button>
        <span style="font-size:12px; font-weight:bold;">${a.progress}${a.total ? ' / ' + a.total : ''}</span>
        <button data-action="inc" class="btn-primary" style="padding:2px 8px;">+</button>
      </div>
      <select data-action="status" style="width:100%; background:var(--bg); color:var(--text-main); border:1px solid var(--line); border-radius:4px; font-size:11px; padding:4px;">
        ${Object.entries(statusDict).map(([k, l]) => `<option value="${k}" ${a.status === k ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
  </article>`;
}

function renderLibrary() {
  const isManga = currentMediaType === 'MANGA';
  $('#collectionTitle').textContent = isManga ? 'Colección de Manga' : 'Colección de Anime';
  let items = Store.list().filter(a => a.type === currentMediaType);
  if (currentTab === 'fav') items = items.filter(a => a.fav);
  else if (currentTab !== 'all') items = items.filter(a => a.status === currentTab);

  $('#library').innerHTML = items.map(libraryCard).join('');
  $('#libraryCount').textContent = `${items.length} elementos`;
  $('#empty').classList.toggle('hidden', items.length > 0);
}

function renderAll() { renderTabs(); renderLibrary(); }

function cardActionControlsHTML(id, inList, m) {
  if (!inList) return `<button data-action="add" class="btn-primary" style="padding:6px; font-size:12px; width:100%;">+ Agregar</button>`;
  const isManga = (inList.type || m?.type) === 'MANGA';
  const statusDict = isManga ? MANGA_STATUSES : ANIME_STATUSES;
  return `<div style="display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--line); padding-top:4px;">
    <div class="flex items-center justify-between">
      <button data-action="dec" class="btn-surface" style="padding:2px 6px; font-size:11px;">−</button>
      <span style="font-size:11px; font-weight:bold;">${inList.progress}${inList.total ? '/'+inList.total : ''}</span>
      <button data-action="inc" class="btn-primary" style="padding:2px 6px; font-size:11px;">+</button>
    </div>
    <select data-action="status" style="width:100%; background:var(--bg); color:var(--text-main); border:1px solid var(--line); border-radius:4px; font-size:11px; padding:2px;">
      ${Object.entries(statusDict).map(([k, l]) => `<option value="${k}" ${inList.status === k ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
  </div>`;
}

function resultCard(m) {
  const inList = Store.get(m.id);
  const isManga = m.type === 'MANGA';
  return `<article class="card" data-id="${m.id}">
    <div style="position:relative; aspect-ratio:2/3; background:#000;">
      <img src="${esc(m.coverImage?.large)}" alt="" style="width:100%; height:100%; object-fit:cover;">
      <span style="position:absolute; top:4px; left:4px;" class="badge-brand">${isManga ? 'MANGA' : 'ANIME'}</span>
    </div>
    <div style="padding:8px; display:flex; flex-direction:column; gap:6px; flex:1;">
      <h3 style="font-size:13px; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${esc(titleOf(m))}</h3>
      <div class="card-action-container" style="margin-top:auto;">${cardActionControlsHTML(m.id, inList, m)}</div>
    </div>
  </article>`;
}

function renderPagination(pageInfo) {
  if (!pageInfo || pageInfo.lastPage <= 1) { $('#paginationContainer').innerHTML = ''; $('#paginationTopContainer').innerHTML = ''; return; }
  const html = `<button data-action="goto-page" data-page="${pageInfo.currentPage - 1}" class="btn-surface" ${pageInfo.currentPage <= 1 ? 'disabled style="opacity:0.5"' : ''}>Anterior</button>
    <span style="font-size:13px; font-weight:bold;">Página ${pageInfo.currentPage} de ${pageInfo.lastPage}</span>
    <button data-action="goto-page" data-page="${pageInfo.currentPage + 1}" class="btn-surface" ${!pageInfo.hasNextPage ? 'disabled style="opacity:0.5"' : ''}>Siguiente</button>`;
  $('#paginationContainer').innerHTML = html;
  $('#paginationTopContainer').innerHTML = html;
}

async function loadMainCatalog() {
  const box = $('#searchResults');
  const q = $('#searchInput').value.trim();
  box.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-muted);">Cargando catálogo…</p>';
  try {
    const { media, pageInfo } = await fetchMediaPage({ q: q.length >= 2 ? q : null, genre: activeCategory.genre, page: currentPage, sort: [activeSort] });
    box.innerHTML = media.length ? media.map(resultCard).join('') : '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">Sin resultados.</p>';
    renderPagination(pageInfo);
  } catch (e) {
    box.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#ef4444;">Error al conectar con AniList. Revisa tu conexión a internet.</p>`;
  }
}

function refreshCardControls(id) {
  const card = document.querySelector(`article[data-id="${id}"]`);
  if (!card) return;
  const container = card.querySelector('.card-action-container');
  if (container) container.innerHTML = cardActionControlsHTML(id, Store.get(id), mediaCache.get(id));
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action], [data-sort]');
  if (!btn) return;
  const id = Number(btn.closest('[data-id]')?.dataset.id || btn.dataset.id);

  if (btn.hasAttribute('data-sort')) {
    activeSort = btn.dataset.sort;
    currentPage = 1;
    loadMainCatalog();
    return;
  }

  switch (btn.dataset.action) {
    case 'toggle-theme':
      const isDark = document.documentElement.classList.toggle('dark');
      $('#themeIcon').textContent = isDark ? '☀️' : '🌙';
      $('#themeText').textContent = isDark ? 'Modo Claro' : 'Modo Oscuro';
      break;
    case 'toggle-categories':
      $('#categoriesDropdown').classList.toggle('hidden');
      break;
    case 'toggle-library-view':
      toggleLibraryView();
      break;
    case 'switch-media-type':
      currentMediaType = btn.dataset.type;
      currentTab = 'all';
      $('#mediaTypeAnimeBtn').className = currentMediaType === 'ANIME' ? 'btn-primary' : 'btn-surface';
      $('#mediaTypeMangaBtn').className = currentMediaType === 'MANGA' ? 'btn-primary' : 'btn-surface';
      renderAll();
      break;
    case 'select-category':
      activeCategory = ALL_CATEGORIES.find(c => c.label === btn.dataset.label) || ALL_CATEGORIES[0];
      $('#selectedCategoryBadge').textContent = `Seleccionado: ${activeCategory.label}`;
      $('#categoriesDropdown').classList.add('hidden');
      currentPage = 1;
      loadMainCatalog();
      break;
    case 'goto-page':
      currentPage = Number(btn.dataset.page);
      loadMainCatalog();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'tab':
      currentTab = btn.dataset.tab;
      renderTabs(); renderLibrary();
      break;
    case 'inc': changeEpisode(id, 1); break;
    case 'dec': changeEpisode(id, -1); break;
    case 'fav':
      const a = Store.get(id);
      if (a) { a.fav = !a.fav; Store.save(); renderAll(); refreshCardControls(id); }
      break;
    case 'add': promptAddStatus(id); break;
    case 'confirm-add-modal': confirmAddModal(); break;
    case 'close-add-modal': $('#addStatusModal').classList.add('hidden'); pendingItemToAdd = null; break;
    case 'clear-search':
      $('#searchInput').value = '';
      currentPage = 1;
      loadMainCatalog();
      break;
  }
});

document.addEventListener('change', (e) => {
  const sel = e.target.closest('select[data-action="status"]');
  if (!sel) return;
  const a = Store.get(Number(sel.closest('[data-id]').dataset.id));
  if (a) { a.status = sel.value; Store.save(); renderAll(); refreshCardControls(a.id); }
});

$('#searchInput').addEventListener('input', debounce(() => { currentPage = 1; loadMainCatalog(); }, 400));

Store.load();
renderCategoryDropdown();
renderAll();
loadMainCatalog();
})();
</script>
</body>
</html>
