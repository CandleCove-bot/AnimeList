<body class="bg-bg text-zinc-100 min-h-screen font-sans antialiased">

<main class="max-w-6xl mx-auto px-4 py-5">

  <!-- ENCABEZADO Y CAMBIO DE TEMA -->
  <header class="flex flex-wrap items-center justify-between gap-3 mb-5">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-bold tracking-tight"><span class="text-brand">Anime</span><span class="text-white">List</span></h1>
      <button id="listViewBtn" data-action="toggle-library-view" aria-pressed="false"
        class="px-5 py-2.5 rounded-xl bg-brand text-black font-extrabold text-base sm:text-lg shadow-lg hover:bg-orange-500 active:scale-95 transition cursor-pointer">
        Mi Lista
      </button>
    </div>
    <div class="flex items-center gap-2">
      <button id="themeToggleBtn" data-action="toggle-theme" class="px-4 py-2.5 rounded-xl bg-surface border border-line text-xs font-bold hover:border-brand transition cursor-pointer flex items-center gap-2">
        <span id="themeIcon">☀️</span> <span id="themeText">Modo Claro</span>
      </button>
    </div>
  </header>

  <!-- BUSCADOR Y BOTÓN DE CATEGORÍAS -->
  <div class="relative mb-4 flex gap-2">
    <input id="searchInput" type="search" autocomplete="off" placeholder="Buscar animé o manga en AniList…"
      class="flex-1 min-w-0 bg-surface border border-line rounded-xl px-4 py-3 text-base placeholder:text-zinc-500 focus:outline-none focus:border-brand">
    <button id="categoryMenuBtn" data-action="toggle-categories" class="px-4 py-3 bg-surface border border-line rounded-xl hover:border-brand flex items-center gap-2 font-semibold text-sm cursor-pointer shrink-0">
      <span>Categorías</span>
      <span class="text-xs">▼</span>
    </button>
    <button id="clearSearchBtn" data-action="clear-search" class="hidden px-3 py-2 text-sm text-brand font-semibold cursor-pointer shrink-0">Limpiar</button>
  </div>

  <!-- MENÚ DESPLEGABLE DE CATEGORÍAS (TEMAS) -->
  <div id="categoriesDropdown" class="hidden mb-4 bg-surface border border-line rounded-xl p-5 shadow-2xl z-30 relative">
    <div class="flex justify-between items-center mb-4">

  </div>

  <!-- VISTA CATÁLOGO -->

    <!-- BARRA DE ORDENAMIENTO PERMANENTE -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-5" id="sortBar">
      <button data-sort="POPULARITY_DESC" class="sort-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border bg-brand border-brand text-black cursor-pointer">🔥 Más populares</button>

<script>
(() => {
'use strict';

const DB_KEY = 'my_anime_tracker_db';
const API_URL = 'https://graphql.anilist.co';

const ANIME_STATUSES = {
  watching: '📺 En espera',
  airing:   '🔴 En emisión',
  later:    '📌 Ver después',
  done:     '✅ Visto',
};

const MANGA_STATUSES = {
  watching: '📺 En espera',
  airing:   '🔴 En emisión',
  reading:  '📖 Leyendo',
  done:     '✅ Leído',
  later:    '📌 Leer después'
};

const SORT_IDLE = 'sort-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border bg-surface border-line text-zinc-300 cursor-pointer';
const SORT_ACTIVE = 'sort-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border bg-brand border-brand text-black cursor-pointer';
const LIB_SORT_IDLE = 'lib-sort-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border bg-surface border-line text-zinc-300 cursor-pointer';
const LIB_SORT_ACTIVE = 'lib-sort-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border bg-brand border-brand text-black cursor-pointer';

const collator = new Intl.Collator('es', { sensitivity: 'base', numeric: true });

const ALL_CATEGORIES = [
  { label: 'Todos', genre: null, tag: null },
  { label: 'Acción', genre: 'Action', tag: null },
  { label: 'Aventura', genre: 'Adventure', tag: null },
  { label: 'Comedia', genre: 'Comedy', tag: null },
  { label: 'Drama', genre: 'Drama', tag: null },
  { label: 'Fantasía', genre: 'Fantasy', tag: null },
  { label: 'Musical', genre: 'Music', tag: null },
  { label: 'Romance', genre: 'Romance', tag: null },
  { label: 'Ciencia Ficción', genre: 'Sci-Fi', tag: null },
  { label: 'Seinen', genre: null, tag: 'Seinen' },
  { label: 'Shoujo', genre: null, tag: 'Shoujo' },
  { label: 'Shounen', genre: null, tag: 'Shounen' },
  { label: 'Recuentos de la Vida', genre: 'Slice of Life', tag: null },
  { label: 'Deportes', genre: 'Sports', tag: null },
  { label: 'Sobrenatural', genre: 'Supernatural', tag: null },
  { label: 'Thriller', genre: 'Psychological', tag: null },
  { label: 'Villanos', genre: null, tag: 'Anti-Hero' }
];

const STATUS_MAP_ES = {
  'RELEASING': 'En emisión',
  'FINISHED': 'Finalizado',
  'CANCELLED': 'Cancelado',
  'NOT_YET_RELEASED': 'Sin confirmar siguiente temporada',
  'HIATUS': 'Sin confirmar siguiente temporada'
};

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const titleOf = (m) => m.title?.english || m.title?.romaji || m.title?.native || 'Sin título';

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.add('hidden'), 2500);
}

const Store = {
  data: { version: 1, items: {} },
  load() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) this.data = this.sanitize(JSON.parse(raw));
    } catch (e) { console.warn('BD local corrupta', e); }
  },
  sanitize(obj) {
    const out = { version: 1, items: {} };
    const src = obj && typeof obj.items === 'object' ? obj.items : {};
    for (const a of Object.values(src)) {
      const id = Number(a?.id);
      if (!Number.isInteger(id) || id <= 0) continue;
      const total = Number.isInteger(a.total) && a.total > 0 ? a.total : null;
      let progress = Math.max(0, parseInt(a.progress, 10) || 0);
      if (total) progress = Math.min(progress, total);
      const mediaType = a.type === 'MANGA' ? 'MANGA' : 'ANIME';
      const validStatuses = mediaType === 'MANGA' ? MANGA_STATUSES : ANIME_STATUSES;
      out.items[id] = {
        id,
        type: mediaType,
        title: String(a.title || 'Sin título').slice(0, 200),
        cover: typeof a.cover === 'string' && a.cover.startsWith('https://') ? a.cover : '',
        total, progress,
        genres: Array.isArray(a.genres) ? a.genres.filter(x => typeof x === 'string') : [],
        tags: Array.isArray(a.tags) ? a.tags.filter(x => typeof x === 'string') : [],
        status: a.status in validStatuses ? a.status : 'later',
        fav: !!a.fav,
        addedAt: Number(a.addedAt) || Date.now(),
      };
    }
    return out;
  },
  save: debounce(function () {
    try { localStorage.setItem(DB_KEY, JSON.stringify(Store.data)); }
    catch (e) { toast('No se pudo guardar: almacenamiento lleno'); }
  }, 250),
  get: (id) => Store.data.items[id],
  list: () => Object.values(Store.data.items),
};

const flush = () => { try { localStorage.setItem(DB_KEY, JSON.stringify(Store.data)); } catch {} };
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

const mediaCache = new Map();
let activeCategory = ALL_CATEGORIES[0];
let activeSort = 'POPULARITY_DESC';
let currentPage = 1;
const PER_PAGE = 20;
let currentMediaType = 'ANIME';

async function gql(query, variables, signal) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ query, variables }),
    signal,
  });
  if (res.status === 429) throw new Error('Demasiadas solicitudes. Espera un minuto.');
  if (!res.ok) throw new Error('Error de AniList (' + res.status + ')');
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

const ANILIST_PAGINATED_QUERY = `query($q:String, $genre:String, $tag:String, $page:Int, $perPage:Int, $sort:[MediaSort]){
  Page(page:$page, perPage:$perPage){
    pageInfo{ total perPage currentPage lastPage hasNextPage }
    media(search:$q, genre:$genre, tag:$tag, isAdult:false, sort:$sort){
      id type title{romaji english native} coverImage{large} episodes chapters status seasonYear genres tags{name} averageScore popularity
    }
  }
}`;

const DETAIL_Q = `query($id:Int){Media(id:$id){
  id type title{romaji english native} coverImage{large} bannerImage episodes chapters status seasonYear
  description(asHtml:false) genres tags{name} format averageScore popularity
}}`;

let apiCtrl = null;
async function fetchMediaPage({ q = null, genre = null, tag = null, page = 1, sort = ['POPULARITY_DESC'], perPage = PER_PAGE } = {}) {
  apiCtrl?.abort();
  apiCtrl = new AbortController();

  const sortKey = Array.isArray(sort) ? sort[0] : sort;
  const hiddenGems = sortKey === 'HIDDEN_GEMS';

  const vars = { page, perPage: hiddenGems ? 50 : perPage, sort: hiddenGems ? ['SCORE_DESC'] : [sortKey] };
  if (q) vars.q = q;
  if (genre) vars.genre = genre;
  if (tag) vars.tag = tag;

  const data = await gql(ANILIST_PAGINATED_QUERY, vars, apiCtrl.signal);
  const pageInfo = data.Page.pageInfo;
  let media = data.Page.media;

  media.forEach((m) => mediaCache.set(m.id, { ...mediaCache.get(m.id), ...m }));

  if (q) {
    const qLower = q.toLowerCase();
    media = media.filter(m => {
      const tEng = (m.title?.english || '').toLowerCase();
      const tRom = (m.title?.romaji || '').toLowerCase();
      const tNat = (m.title?.native || '').toLowerCase();
      return tEng.includes(qLower) || tRom.includes(qLower) || tNat.includes(qLower);
    });
  }

  if (hiddenGems) {
    media = media.filter(m => (m.averageScore || 0) >= 75 && (m.popularity || 0) < 60000);
    media.sort((a, b) => (b.averageScore || 0) - (a.averageScore || 0));
    media = media.slice(0, PER_PAGE);
  } else if (!q && activeCategory.label === 'Todos' && sortKey === 'POPULARITY_DESC') {
    media.sort((a, b) => collator.compare(titleOf(a), titleOf(b)));
  } else if (sortKey === 'TITLE_ENGLISH') {
    media = media.slice().sort((a, b) => collator.compare(titleOf(a), titleOf(b)));
  }

  return { media, pageInfo };
}

async function fetchDetail(id) {
  const cached = mediaCache.get(id);
  if (cached?.description !== undefined) return cached;
  const data = await gql(DETAIL_Q, { id });
  mediaCache.set(id, { ...cached, ...data.Media });
  return mediaCache.get(id);
}

let currentTab = 'all';
let showingLibrary = false;
let librarySort = 'recent';
let librarySearchToken = 0;
let pendingItemToAdd = null;
let pendingModalStatus = 'watching';
let pendingModalFav = false;

function syncSearchUI() {
  const input = $('#searchInput');
  input.placeholder = showingLibrary
    ? 'Buscar en la base de datos de AniList…'
    : 'Buscar animé o manga en el catálogo de AniList…';
  $('#clearSearchBtn').classList.toggle('hidden', !(input.value.trim() || activeCategory.label !== 'Todos'));
}

function hideLibrarySearch() {
  librarySearchToken++;
  $('#librarySearchPanel').classList.add('hidden');
  $('#librarySearchResults').innerHTML = '';
}

function searchSkeleton() {
  return Array.from({ length: 10 }, () => `
    <div class="rounded-xl overflow-hidden border border-line bg-surface animate-pulse" aria-hidden="true">
      <div class="aspect-[2/3] bg-zinc-800"></div>
      <div class="p-2 flex flex-col gap-2">
        <div class="h-3 rounded bg-zinc-800"></div>
        <div class="h-3 w-2/3 rounded bg-zinc-800/70"></div>
        <div class="h-8 rounded-lg bg-zinc-800/60"></div>
      </div>
    </div>`).join('');
}

async function runLibrarySearch() {
  if (!showingLibrary) return;
  const q = $('#searchInput').value.trim();
  const panel = $('#librarySearchPanel');
  const box = $('#librarySearchResults');

  if (q.length < 2) {
    if (!q) { hideLibrarySearch(); return; }
    librarySearchToken++;
    panel.classList.remove('hidden');
    box.innerHTML = `<p class="col-span-full text-sm text-zinc-400 py-6 text-center">Escribe al menos 2 caracteres para buscar en la base de datos.</p>`;
    return;
  }

  const token = ++librarySearchToken;
  panel.classList.remove('hidden');
  box.innerHTML = searchSkeleton();

  try {
    const { media } = await fetchMediaPage({
      q,
      genre: activeCategory.genre,
      tag: activeCategory.tag,
      page: 1,
      sort: ['SEARCH_MATCH'],
      perPage: 20,
    });
    if (token !== librarySearchToken || !showingLibrary) return;
    box.innerHTML = media.length
      ? media.map(resultCard).join('')
      : `<p class="col-span-full text-sm text-zinc-400 py-8 text-center">No se encontró ningún resultado para “${esc(q)}”.</p>`;
  } catch (e) {
    if (token !== librarySearchToken || e.name === 'AbortError') return;
    box.innerHTML = `<div class="col-span-full text-center py-8">

function promptAddStatus(id) {

function closeAddModal() {
  $('#addStatusModal').classList.add('hidden');
  pendingItemToAdd = null;
}

function confirmAddModal() {
  if (!pendingItemToAdd) return;
  const m = pendingItemToAdd;
  addAnimeWithStatus(m, pendingModalStatus, pendingModalFav);
  closeAddModal();
}

function addAnimeWithStatus(m, initialStatus, isFav = false) {
  if (Store.get(m.id)) return;
  const isManga = m.type === 'MANGA';
  const totalCount = isManga ? (m.chapters || null) : (m.episodes || null);

  Store.data.items[m.id] = {
    id: m.id,
    type: isManga ? 'MANGA' : 'ANIME',
    title: titleOf(m),
    cover: m.coverImage?.large || '',
    genres: Array.isArray(m.genres) ? m.genres : [],
    tags: Array.isArray(m.tags) ? m.tags.map(t => typeof t === 'string' ? t : t.name).filter(Boolean) : [],
    total: totalCount,
    progress: 0,
    status: initialStatus,
    fav: isFav,
    addedAt: Date.now(),
  };
  Store.save();
  renderAll();
  refreshCardControls(m.id);
  toast(`"${titleOf(m)}" agregado a tu lista`);
}

function changeEpisode(id, delta) {
  const a = Store.get(id);
  if (!a) return;
  const max = a.total ?? Infinity;
  a.progress = Math.min(max, Math.max(0, a.progress + delta));
  checkProgressStatus(a);
  Store.save();
  renderAll();
  refreshCardControls(id);
}

function setExactEpisode(id, val) {
  const a = Store.get(id);
  if (!a) return;
  const num = parseInt(val, 10);
  if (isNaN(num) || num < 0) return;
  const max = a.total ?? Infinity;
  a.progress = Math.min(max, num);
  checkProgressStatus(a);
  Store.save();
  renderAll();
  refreshCardControls(id);
}

function checkProgressStatus(a) {
  if (a.total && a.progress >= a.total && a.status !== 'done') {
    a.status = 'done'; toast('¡Completaste ' + a.title + '!');
  } else if (a.status === 'later' && a.progress > 0) {
    a.status = 'watching';
  }
}

function renderPaginationControls(pageInfo) {
  if (!pageInfo || pageInfo.lastPage <= 1) return '';

  const current = pageInfo.currentPage;
  const last = pageInfo.lastPage; // Paginación dinámica real adaptable al total
  let html = '';

  if (current > 1) {
    html += `<button data-action="goto-page" data-page="${current - 1}" class="px-3 py-1 rounded bg-surface border border-line text-xs hover:border-brand cursor-pointer">Anterior</button>`;
  }

  const start = Math.max(1, current - 2);
  const end = Math.min(last, current + 2);

  if (start > 1) {
    html += `<button data-action="goto-page" data-page="1" class="px-3 py-1 rounded bg-surface border border-line text-xs hover:border-brand cursor-pointer">1</button>`;
    if (start > 2) html += `<span class="text-zinc-500 px-1">...</span>`;
  }

  for (let i = start; i <= end; i++) {
    const active = i === current;
    html += `<button data-action="goto-page" data-page="${i}" class="px-3 py-1 rounded text-xs font-bold cursor-pointer ${active ? 'bg-brand text-black border border-brand' : 'bg-surface border border-line text-zinc-300 hover:border-brand'}">${i}</button>`;
  }

  if (end < last) {
    if (end < last - 1) html += `<span class="text-zinc-500 px-1">...</span>`;
    html += `<button data-action="goto-page" data-page="${last}" class="px-3 py-1 rounded bg-surface border border-line text-xs hover:border-brand cursor-pointer">${last}</button>`;
  }

  if (current < last) {
    html += `<button data-action="goto-page" data-page="${current + 1}" class="px-3 py-1 rounded bg-surface border border-line text-xs hover:border-brand cursor-pointer">Siguiente</button>`;
  }

  return html;
}

function renderPagination(pageInfo) {

  $('#paginationTopContainer').innerHTML = html;

async function loadMainCatalog() {
  const box = $('#searchResults');
  const q = $('#searchInput').value.trim();

  let titleText = 'Catálogo General (Anime & Manga)';
  if (q.length > 0) {
    titleText = `Resultados para "${q}"`;
    $('#clearSearchBtn').classList.remove('hidden');
  } else if (activeCategory.label !== 'Todos') {
    titleText = `Categoría: ${activeCategory.label}`;
    $('#clearSearchBtn').classList.remove('hidden');
  } else {
    $('#clearSearchBtn').classList.add('hidden');
  }
  if (activeSort === 'TITLE_ENGLISH') titleText += ' · A-Z';

  $('#searchTitle').textContent = titleText;
  box.innerHTML = '<p class="col-span-full text-zinc-400 py-4 text-center">Cargando catálogo desde AniList…</p>';
  $('#paginationContainer').innerHTML = '';
  $('#paginationTopContainer').innerHTML = '';

  try {
    const { media, pageInfo } = await fetchMediaPage({
      q: q.length >= 2 ? q : null,
      genre: activeCategory.genre,
      tag: activeCategory.tag,
      page: currentPage,
      sort: [activeSort]
    });

    box.innerHTML = media.length ? media.map(resultCard).join('') : '<p class="col-span-full text-zinc-400 py-4 text-center">No se encontraron resultados para este criterio.</p>';
    renderPagination(pageInfo);
  } catch (e) {
    if (e.name !== 'AbortError') box.innerHTML = `<p class="col-span-full text-red-400 py-4 text-center">${esc(e.message)}. Revisa tu conexión.</p>`;
  }
}

          <p class="text-xs text-zinc-400 mt-1">Estreno: ${m.seasonYear || 'desconocido'}${countLabel ? ' · ' + countLabel : ''}</p>

        </div>
      </div>
      <div class="mt-5">
        <h4 class="text-xs font-bold text-zinc-400 uppercase mb-1">Sinopsis</h4>
        <p class="text-base text-zinc-200 leading-relaxed whitespace-pre-line">${loading ? 'Cargando sinopsis…' : esc(translatedDescription ?? (m.description ? 'Traduciendo sinopsis al español…' : 'Sin sinopsis disponible.'))}</p>
      </div>

        ${inList ? '' : `<button data-action="modal-add" data-id="${id}" class="flex-1 py-3 rounded-lg bg-brand text-black font-semibold cursor-pointer">Agregar a mi lista</button>`}
        <button data-action="modal-close" class="flex-1 py-3 rounded-lg bg-zinc-800 cursor-pointer">Cerrar</button>
      </div>`;

  draw(base, true);

    const detail = await fetchDetail(id);
    draw(detail, false, detail.description ? 'Traduciendo sinopsis al español…' : 'Sin sinopsis disponible.');
    if (detail.description) {
      try {
        const translated = await translateDescriptionToSpanish(detail.description);
        if (!$('#modal').classList.contains('hidden')) draw(detail, false, translated);
      } catch (translationError) {
        if (!$('#modal').classList.contains('hidden')) draw(detail, false, stripHtml(detail.description));
      }
    }
  } catch (e) { draw(base, false, 'No se pudo cargar la sinopsis.'); toast(e.message); }
}

const stripHtml = (s) => String(s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
const translatedDescriptionCache = new Map();

async function translateDescriptionToSpanish(description) {
  const clean = stripHtml(description).trim();
  if (!clean) return '';
  if (translatedDescriptionCache.has(clean)) return translatedDescriptionCache.get(clean);
  const params = new URLSearchParams({ client: 'gtx', sl: 'auto', tl: 'es', dt: 't', q: clean });
  const response = await fetch(`https://translate.googleapis.com/translate_a/single?${params.toString()}`);
  if (!response.ok) throw new Error('No se pudo traducir la sinopsis.');
  const data = await response.json();
  const translated = Array.isArray(data?.[0]) ? data[0].map(part => part?.[0] || '').join('') : '';
  if (!translated) throw new Error('Traducción vacía.');
  translatedDescriptionCache.set(clean, translated);
  return translated;
}

}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action], [data-sort], [data-lib-sort]');
  if (!btn) return;
  const id = Number(btn.closest('[data-id]')?.dataset.id || btn.dataset.id);

  if (btn.hasAttribute('data-sort')) {
    activeSort = btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(b => { b.className = SORT_IDLE; });
    btn.className = SORT_ACTIVE;
    currentPage = 1;
    loadMainCatalog();
    return;
  }

  if (btn.hasAttribute('data-lib-sort')) {
    librarySort = btn.dataset.libSort;
    document.querySelectorAll('.lib-sort-btn').forEach(b => {
      b.className = LIB_SORT_IDLE;
      b.setAttribute('aria-pressed', 'false');
    });
    btn.className = LIB_SORT_ACTIVE;
    btn.setAttribute('aria-pressed', 'true');
    renderLibrary();
    return;
  }

  switch (btn.dataset.action) {
    case 'toggle-theme':
      toggleTheme();
      break;
    case 'toggle-categories':
      $('#categoriesDropdown').classList.toggle('hidden');
      break;
    case 'toggle-library-view':
      toggleLibraryView();
      break;
    case 'switch-media-type': {
      currentMediaType = btn.dataset.type;
      currentTab = 'all';
      const isAnime = currentMediaType === 'ANIME';
      $('#mediaTypeAnimeBtn').className = `px-5 py-2.5 rounded-xl font-bold text-sm transition cursor-pointer ${isAnime ? 'bg-brand text-black' : 'bg-surface border border-line text-zinc-300 hover:border-brand'}`;
      $('#mediaTypeMangaBtn').className = `px-5 py-2.5 rounded-xl font-bold text-sm transition cursor-pointer ${!isAnime ? 'bg-brand text-black' : 'bg-surface border border-line text-zinc-300 hover:border-brand'}`;
      renderAll();
      break;
    }
    case 'select-category': {
      const catLabel = btn.dataset.label;
      activeCategory = ALL_CATEGORIES.find((c) => c.label === catLabel) || ALL_CATEGORIES[0];
      currentPage = 1;
      renderCategoryDropdown();
      $('#categoriesDropdown').classList.add('hidden');
      if (showingLibrary) {
        renderLibrary();
        syncSearchUI();
        runLibrarySearch();
      } else loadMainCatalog();
      break;
    }
    case 'goto-page':
      currentPage = Number(btn.dataset.page);
      loadMainCatalog();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'tab': currentTab = btn.dataset.tab; renderTabs(); renderLibrary(); break;
    case 'inc': changeEpisode(id, 1); break;
    case 'dec': changeEpisode(id, -1); break;
    case 'set-ep': {
      const a = Store.get(id);
      if (!a) break;
      const res = prompt(`Escribe el número visto para "${a.title}":`, a.progress);
      if (res !== null) setExactEpisode(id, res);
      break;
    }
    case 'fav': {
      const a = Store.get(id);
      if (!a) break;
      a.fav = !a.fav;
      Store.save(); renderAll(); refreshCardControls(id);
      toast(a.fav ? 'Añadido a favoritos' : 'Quitado de favoritos');
      break;
    }
    case 'remove': {
      const a = Store.get(id);
      if (!a) break;
      if (confirm('¿Quitar "' + a.title + '" de tu lista?')) {
        delete Store.data.items[id];
        Store.save(); renderAll(); refreshCardControls(id); toast('Eliminado de tu lista');
      }
      break;
    }
    case 'add':
      promptAddStatus(id);
      break;
    case 'modal-add':
      closeDetail();
      promptAddStatus(id);
      break;
    case 'confirm-add-modal':
      confirmAddModal();
      break;
    case 'close-add-modal':
      closeAddModal();
      break;
    case 'detail': openDetail(id); break;
    case 'modal-close': closeDetail(); break;
    case 'clear-search':
      $('#searchInput').value = '';
      activeCategory = ALL_CATEGORIES[0];
      currentPage = 1;
      renderCategoryDropdown();
      if (showingLibrary) {
        hideLibrarySearch();
        renderLibrary();
        syncSearchUI();
      } else {
        syncSearchUI();
        loadMainCatalog();
      }
      break;
  }
});

document.addEventListener('change', (e) => {
  const sel = e.target.closest('select[data-action="status"]');
  if (!sel) return;
  const a = Store.get(Number(sel.closest('[data-id]').dataset.id));
  if (!a) return;
  a.status = sel.value;
  if (a.status === 'done' && a.total) a.progress = a.total;
  Store.save(); renderAll(); refreshCardControls(a.id);
});

initTheme();
Store.load();
renderCategoryDropdown();
renderAll();
syncSearchUI();
loadMainCatalog();
})();
</script>
</body>
</html>
